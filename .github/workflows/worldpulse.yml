name: WorldPulse data

# Collects public data on GitHub's runners, analyses it and publishes compact
# JSON. Scheduled runs are best-effort (GitHub may delay or skip them).
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: worldpulse-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  DATA_BRANCH: worldpulse-data   # orphan branch holding only the latest snapshot (force-pushed, no history growth)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (offline)
        run: python -m pytest -q tests

      - name: Restore previous database (keeps history for baselines)
        run: |
          mkdir -p ../data
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:worldpulse.sqlite.gz" > ../data/worldpulse.sqlite.gz && gunzip -f ../data/worldpulse.sqlite.gz && ls -la ../data || echo "no previous database"
          else
            echo "first run: no data branch yet"
          fi

      - name: Collect, analyse, export
        timeout-minutes: 22
        env:
          PYTHONUNBUFFERED: "1"
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          WORLDPULSE_DB: ${{ github.workspace }}/data/worldpulse.sqlite
          WORLDPULSE_EXPORT: ${{ github.workspace }}/data/public
          WORLDPULSE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m worldpulse run --force

      - name: Publish snapshot to the data branch
        run: |
          cd ../data
          gzip -9 -k -f worldpulse.sqlite
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          cp -r public/. /tmp/snap/
          cp worldpulse.sqlite.gz /tmp/snap/
          cat > /tmp/snap/README.md <<EOF
          # WorldPulse data snapshot
          Generated by the "WorldPulse data" workflow at $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA}.
          Latest snapshot only — this branch is force-pushed on every run.
          EOF
          cd /tmp/snap
          git init -q -b "$DATA_BRANCH"
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "WorldPulse data snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DATA_BRANCH:$DATA_BRANCH"

      - name: Open a data-health issue when checks fail (free notification)
        if: always() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          Q=../data/public/quality.json
          PROBLEMS=""
          if [ "$JOB_STATUS" != "success" ]; then PROBLEMS="The data run failed. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; fi
          if [ -f "$Q" ]; then PROBLEMS="$PROBLEMS$(python3 -c "import json;q=json.load(open('$Q'));print(chr(10).join('- '+p for p in q.get('problems',[])))")"; fi
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label data-health --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PROBLEMS" ]; then
            gh label create data-health --repo "$GITHUB_REPOSITORY" --color d93f0b --description "Automatic data checks" 2>/dev/null || true
            if [ -z "$OPEN" ]; then
              printf 'WorldPulse automatic checks found problems on %s UTC:\n\n%s\n\nThis issue closes itself when a later run passes.\n' "$(date -u +%Y-%m-%dT%H:%M)" "$PROBLEMS" > /tmp/body.md
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Data health: automatic checks failed" --label data-health --body-file /tmp/body.md
            else
              printf 'Still failing on %s UTC:\n\n%s\n' "$(date -u +%Y-%m-%dT%H:%M)" "$PROBLEMS" > /tmp/body.md
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Checks passed on $(date -u +%Y-%m-%dT%H:%M) UTC."
          fi

  pages:
    # Needs Settings → Pages → Source: GitHub Actions (one-time).
    needs: collect
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest data snapshot
        run: |
          set -o pipefail
          git fetch --depth=1 origin "$DATA_BRANCH"
          mkdir -p public/data
          (cd "$GITHUB_WORKSPACE" && git archive FETCH_HEAD) | tar -x -C public/data
          rm -f public/data/worldpulse.sqlite.gz
          test -f public/data/meta.json || { echo "::error::data snapshot missing meta.json"; exit 1; }
          ls public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          WORLDPULSE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
